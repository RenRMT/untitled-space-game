<!doctype html>
<html lang="en" data-ui="line">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>Untitled Space Game</title>
<!-- Installable as a home-screen app: full screen, and its saved data is no longer cleared after a
     week away (Safari clears a site's storage after seven days without a visit). -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Space Game">
<!-- The fonts, served with the game (assets/fonts, declared in the kit stylesheets): the Line style's
     B612 and B612 Mono first, as the default style's. -->
<link rel="preload" href="assets/fonts/b612-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/b612-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<!-- The UI kit: colour tokens, type and the components every panel is built from (src/ui/kit.js). -->
<link href="src/ui/kit.css" rel="stylesheet">
<!-- Each art style's UI kit, over the base one: html[data-ui] follows the art style (game/options.js). -->
<link href="src/ui/kit-line.css" rel="stylesheet">
<link href="src/ui/kit-lowpoly.css" rel="stylesheet">
<style>
  /* Screen layouts on top of the UI kit (src/ui/kit.css), which holds the tokens: --bg, --s1, --line,
     --cyan, --sans, --mono, ... */
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; overscroll-behavior: none; }
  body { font-family: var(--sans); -webkit-text-size-adjust: 100%; }
  button { -webkit-tap-highlight-color: transparent; }
  canvas {
    display: block; width: 100vw; height: 100vh; height: 100dvh;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  #game { cursor: crosshair; }
  #map-canvas { cursor: grab; }

  /* The plain button of the flight view, the map and the dialogs: a kit button (.ui-btn) on a
     panel background, so it reads over space. */
  .btn {
    min-height: 40px; box-sizing: border-box; padding: 0 12px;
    font: 700 13px/1 var(--sans); letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--hud); background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--r-md);
    cursor: pointer; touch-action: manipulation;
  }
  .btn:hover, .btn:focus-visible { border-color: var(--cyan); color: var(--cyan); outline: none; }
  .btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .btn[aria-pressed="true"] { border-color: var(--cyan); color: var(--bg); background: var(--cyan); }

  /* Factions, map and settings: icon buttons side by side in the bottom-right corner, level with the speed
     bar and clear of the panels above it; a full touch target each (--hit, ui/kit.css). */
  .icon-btn {
    position: absolute; z-index: 4; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    width: var(--hit); height: var(--hit); min-height: 0; padding: 0; display: grid; place-items: center;
  }
  .icon-btn[aria-expanded="true"] { border-color: var(--cyan); color: var(--cyan); }
  .icon-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
  #factions-btn { right: calc(12px + 2 * (var(--hit) + 8px) + env(safe-area-inset-right, 0px)); }
  #map-btn { right: calc(12px + var(--hit) + 8px + env(safe-area-inset-right, 0px)); }
  #settings-btn { right: calc(12px + env(safe-area-inset-right, 0px)); }
  .btn:disabled { opacity: 0.4; cursor: default; border-color: var(--line); color: var(--hud); }

  #map-overlay { position: fixed; inset: 0; z-index: 2; background: var(--bg); font: 14px var(--sans); color: var(--hud); }
  #map-overlay[hidden] { display: none; }
  #map-overlay .bar {
    position: absolute; left: 0; right: 0; display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; pointer-events: none;
  }
  #map-overlay .bar > * { pointer-events: auto; }
  #map-overlay .top { top: 0; padding-top: calc(10px + env(safe-area-inset-top, 0px)); background: linear-gradient(var(--bg), rgba(5, 6, 10, 0)); }
  /* The bottom bar stops short of the map and settings buttons, which stay above the map. */
  #map-overlay .bottom {
    bottom: 0; flex-wrap: wrap; gap: 8px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    padding-right: calc(12px + var(--hit) * 2 + 8px + 12px + env(safe-area-inset-right, 0px));
    background: linear-gradient(rgba(5, 6, 10, 0), var(--bg));
  }
  #map-overlay .bottom .spacer { flex: 1; pointer-events: none; }
  #map-overlay .btn { min-height: var(--hit); }
  #map-title { font: 700 15px var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--cyan); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #map-view { flex: none; gap: 0; }
  #map-view .btn { flex: none; padding: 0 12px; }
  #map-view .btn:first-child { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  #map-view .btn:last-child { border-top-left-radius: 0; border-bottom-left-radius: 0; border-left: none; }
  #map-investigate { border-color: var(--cyan); color: var(--cyan); }

  /* Selection callout (ui/callout.js): the selected thing's name and details above it, its
     actions below, moved into place by transforms. Only the buttons take taps. */
  .callout { position: absolute; left: 0; top: 0; pointer-events: none; }
  .callout[hidden] { display: none; }
  .co-above, .co-below { position: absolute; left: 0; top: 0; display: flex; flex-direction: column; align-items: center; white-space: nowrap; }
  .co-above { gap: 1px; padding: 3px 7px; background: rgba(5, 6, 10, 0.72); border-radius: var(--r-md); }
  .co-below { flex-direction: row; gap: 6px; }
  .co-below .btn { pointer-events: auto; min-height: var(--hit); }
  .co-below .btn.primary:not(:disabled) { border-color: var(--cyan); color: var(--cyan); }
  .co-name { font: 600 14px var(--sans); color: var(--bright); }
  .co-meta { font: 12px var(--mono); color: var(--dim); }
  #map-overlay [hidden] { display: none !important; }
  #map-prompt {
    position: absolute; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    width: min(340px, calc(100vw - 24px)); box-sizing: border-box; padding: 12px;
    background: var(--s1); border: 1px solid var(--line); border-left: 3px solid var(--cyan); border-radius: var(--r-lg);
    display: flex; flex-direction: column; gap: 10px; font-size: 15px; color: var(--bright);
  }
  #map-prompt .actions { display: flex; gap: 8px; justify-content: flex-end; }

  @media (max-width: 560px) {
    #map-overlay .btn { padding: 0 9px; font-size: 12px; letter-spacing: 0.08em; }
    #map-title { flex: 1 1 0; }
  }

  /* Panels above the speed bar: in a fight, the combat panel. The coloured left edge is each
     panel's own. */
  .panel {
    position: absolute; left: 50%; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    box-sizing: border-box; padding: 10px 10px 10px 12px;
    background: var(--panel); border: 1px solid var(--line); border-left-width: 3px; border-radius: var(--r-lg);
    font: 14px var(--sans); color: var(--hud);
  }
  .panel[hidden] { display: none; }

  /* Context menu (ui/context.js): tap a station, asteroid or ship and what you can do there shows
     as round icon buttons fanned out below it. Nothing shows above it: what it is stays in the
     page for screen readers only. Docked, the flight controls go away. */
  #context { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; z-index: 1; }
  #context[hidden] { display: none; }
  .cx-info {
    position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap; pointer-events: none;
  }
  .cx-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .cx-title { flex: 1; min-width: 0; color: var(--bright); font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cx-tag { font: 700 11px var(--sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
  .cx-tag.hostile { color: var(--hostile); }
  .cx-tag.good { color: var(--good); }
  .cx-tag.warn { color: var(--warn); }
  .cx-head.more { cursor: pointer; }
  .cx-detail { font: 12px var(--mono); color: var(--hud); margin-top: 1px; white-space: nowrap; }
  .cx-detail[hidden] { display: none; }
  /* Drawn 28 px, but a full touch target: the button overhangs the card by its margins. */
  .cx-close {
    width: var(--hit); height: var(--hit); flex: none; display: grid; place-items: center;
    font: 400 20px/1 var(--sans); color: var(--dim); background: none; border: 0; padding: 0; margin: -12px -10px -12px -8px;
    cursor: pointer; touch-action: manipulation;
  }
  .cx-close:hover, .cx-close:focus-visible { color: var(--cyan); outline: none; }
  .cx-sub { font: 12px var(--mono); color: var(--dim); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cx-state { font: 12px var(--mono); color: var(--warn); margin-top: 1px; white-space: nowrap; }
  .cx-state[hidden] { display: none; }
  .cx-actions { position: absolute; left: 0; top: 0; }
  .cx-act {
    position: absolute; left: 0; top: 0; width: var(--hit); height: var(--hit); padding: 0; display: grid; place-items: center;
    border: 1px solid var(--cyan); border-radius: 50%; background: var(--panel); color: var(--cyan);
    cursor: pointer; touch-action: manipulation; pointer-events: auto;
  }
  .cx-act svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
  .cx-act:hover { background: #0f1a24; }
  /* An action's name under its button, for its first few uses (ui/context.js). */
  .cx-lbl {
    position: absolute; top: calc(100% + 3px); left: 50%; transform: translateX(-50%); white-space: nowrap; pointer-events: none;
    font: 700 11px/1 var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--cyan);
    padding: 2px 4px; background: rgba(5, 6, 10, 0.72); border-radius: var(--r-sm);
  }
  .cx-act:disabled .cx-lbl { color: var(--dim); }
  .cx-act:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .cx-act:disabled { border-color: var(--line); color: var(--dim); cursor: default; }
  /* A running action (mining) fills a ring round its button. */
  .cx-act.busy:disabled {
    border-color: transparent; color: var(--busy);
    background: radial-gradient(closest-side, var(--panel) calc(100% - 3px), transparent calc(100% - 2px)),
      conic-gradient(var(--busy) var(--progress, 0%), var(--line) var(--progress, 0%));
  }
  body.docked #factions-btn, body.docked #map-btn, body.docked #settings-btn, body.docked #context { display: none; }

  /* Combat panel: replaces the context menu during a fight. One row per ship with shield (top)
     and hull (bottom) bars; enemy rows are buttons that focus fire. */
  #combat {
    --shd: var(--cyan); --hul: var(--good);
    width: min(380px, calc(100vw - 24px)); border-left-color: var(--hostile);
  }
  #combat.won { border-left-color: var(--hul); }
  #combat.fled { border-left-color: var(--cyan); }
  .cb-head { display: flex; align-items: center; gap: 8px; }
  .cb-title { flex: 1; min-width: 0; color: var(--bright); font: 700 15px var(--sans); letter-spacing: 0.1em; text-transform: uppercase; }
  #combat.lost .cb-title { color: var(--hostile); }
  .cb-btn { min-height: var(--hit); padding: 0 16px; border-color: var(--cyan); color: var(--cyan); background: transparent; }
  .cb-btn:disabled { border-color: var(--line); color: var(--dim); opacity: 1; }
  .cb-track { height: 2px; margin: 8px 0 4px; background: var(--line-soft); border-radius: 1px; overflow: hidden; }
  .cb-timer { display: block; height: 100%; width: 0; background: var(--hostile); }
  .cb-timer.escape { background: var(--cyan); }
  #combat .cb-btn[hidden] { display: none; }
  /* Abilities: a small button per consumable in the kit, its code over the charges left. */
  .cb-abil { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 4px; }
  #combat .cb-abil[hidden] { display: none; }
  .cb-ab {
    min-width: var(--hit); min-height: var(--hit); padding: 4px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 1px solid var(--good); border-radius: 6px; background: transparent; color: var(--good); cursor: pointer; touch-action: manipulation;
  }
  .cb-ab .n { font: 400 10px var(--mono); color: var(--hud); }
  .cb-ab:disabled { border-color: var(--line); color: var(--dim); cursor: default; }
  .cb-ab:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  #combat:not(.won):not(.lost):not(.fled) .cb-timer { opacity: 0.8; }
  #combat.won .cb-track, #combat.lost .cb-track, #combat.fled .cb-track { visibility: hidden; }
  .cb-rows { display: flex; flex-direction: column; }
  .cb-row {
    display: grid; grid-template-columns: minmax(0, 1fr) 110px auto; align-items: center; column-gap: 8px;
    width: 100%; min-height: 36px; box-sizing: border-box; padding: 6px 4px 6px 14px; margin: 0; border: 0; border-top: 1px solid var(--line-soft);
    background: none; color: var(--hud); font: inherit; text-align: left; position: relative;
  }
  .cb-row:first-child { border-top: 0; }
  button.cb-row { cursor: pointer; touch-action: manipulation; min-height: var(--hit); }
  button.cb-row:hover .cb-name, button.cb-row:focus-visible .cb-name { color: var(--bright); }
  button.cb-row:focus-visible { outline: 1px solid var(--cyan); outline-offset: -1px; border-radius: var(--r-sm); }
  .cb-row.focus::before { content: '▸'; position: absolute; left: 2px; color: var(--hostile); }
  .cb-row.focus .cb-name { color: var(--bright); }
  .cb-row.you .cb-name { color: var(--cyan); }
  .cb-run { font: 500 11px var(--mono); color: var(--good); }
  .cb-aim { font: 500 12px var(--sans); color: var(--dim); }
  .cb-aim.you { color: var(--hostile); }
  .cb-aim.locking { opacity: 0.55; }
  .cb-row.down { opacity: 0.45; }
  .cb-name { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--hud); }
  .cb-bars { display: flex; flex-direction: column; gap: 2px; }
  .cb-bar { display: block; height: 4px; background: var(--line-soft); border-radius: 2px; overflow: hidden; }
  .cb-bar > span { display: block; height: 100%; transition: width 0.25s ease-out; }
  .cb-bar.shd > span { background: var(--shd); }
  .cb-bar.hul > span { background: var(--hul); }
  .cb-row:not(.you) .cb-bar.hul > span { background: var(--hostile); }
  .cb-nums { font: 500 12px var(--mono); color: var(--dim); text-align: right; white-space: nowrap; }
  .cb-log { font-size: 13px; color: var(--dim); margin-top: 6px; min-height: 1.3em; line-height: 1.3; }
  .cb-log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (prefers-reduced-motion: reduce) { .cb-bar > span { transition: none; } }
  body.in-combat #context, body.in-combat #factions-btn, body.in-combat #map-btn, body.in-combat #settings-btn { display: none; }
  /* Consumables in the field (ui/field-bar.js): a column of buttons up the right-hand side, above the
     corner buttons, each its icon over the charges left. */
  #field {
    position: absolute; z-index: 3; right: calc(12px + env(safe-area-inset-right, 0px));
    bottom: calc(12px + var(--hit) + 12px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column-reverse; flex-wrap: wrap-reverse; gap: 6px; /* a short screen: a second column, to the left */
    max-height: calc(100dvh - 2 * var(--hit) - 200px);
  }
  #field[hidden] { display: none; }
  .fb-ab {
    width: var(--hit); min-height: var(--hit); padding: 4px 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 1px solid var(--good); border-radius: 6px; background: var(--panel); color: var(--good); cursor: pointer; touch-action: manipulation;
  }
  .fb-ab .n { font: 400 10px var(--mono); color: var(--hud); }
  .fb-ab:disabled { border-color: var(--line); color: var(--dim); cursor: default; }
  .fb-ab:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  body.docked #field, body.intro #field, body.in-combat #field, body.warping #field, body.talking #field { display: none; }
  /* Mining (game/combat.js extract) has no panel: only the context menu and the map wait for it. */
  body.mining #context, body.mining #map-btn { display: none; }

  /* Station screen: header, the tab's content, then the icon tab bar and Launch in thumb reach.
     Sheets (#st-layer) slide up over it. */
  #station {
    --culture: var(--dim);
    position: fixed; inset: 0; z-index: 2; background: var(--bg); color: var(--hud);
    font: 15px/1.4 var(--sans); display: flex; flex-direction: column; align-items: center;
    padding-top: env(safe-area-inset-top, 0px);
    animation: st-in 0.22s ease-out;
  }
  #station[hidden] { display: none; }
  @keyframes st-in { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #station { animation: none; } }
  #station > .st-head, #station > #st-body, #station > #st-note, #station > .ui-nav { width: min(560px, 100%); box-sizing: border-box; }

  .st-head { flex: none; display: flex; align-items: center; gap: 12px; padding: 22px 16px 12px; border-bottom: 1px solid var(--line-soft); }
  .st-head .culture { width: 3px; align-self: stretch; background: var(--culture); border-radius: 2px; }
  .st-head .id { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  #st-name { font-size: 19px; font-weight: 600; line-height: 1.15; color: var(--bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #st-sub { font-size: 13px; color: var(--dim); letter-spacing: 0.04em; }
  .st-credits {
    flex: none; display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px;
    border: 1px solid var(--line); border-radius: 16px; background: var(--s1);
  }
  .st-credits i { width: 7px; height: 7px; background: var(--cyan); transform: rotate(45deg); }
  #st-credits { font: 500 14px var(--mono); color: var(--cyan); white-space: nowrap; }

  #st-body {
    flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 16px 16px 24px;
    display: flex; flex-direction: column; gap: 18px;
  }
  #st-body > * { flex: none; }
  #st-body > .ui-schematic { margin: -4px auto -6px; }
  .st-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: -8px; }
  /* A tab's first line: its count (left) and, once its explanations have folded away, ⓘ (right). */
  .st-lead { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 24px; margin: -6px 0 -10px; font-size: 12px; color: var(--dim); }
  .st-lead .num { font-size: 12px; }
  .st-info { width: 36px; height: 36px; margin: -6px -8px -6px auto; font-size: 18px; }
  .st-info[aria-expanded="true"] { color: var(--cyan); }
  .st-holdn { font-size: 12px; color: var(--hud); white-space: nowrap; }
  .st-holdbar .ui-btn { min-height: 36px; padding: 0 10px; font-size: 12px; }
  .st-holdbar .ui-btn:disabled { opacity: 0.4; } /* greyed out: nothing in the hold for it */
  .ui-btn { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; } /* held down to repeat */
  /* A wingman's last fight (Squad tab): a step per line switch, its time, what it did, its hull. */
  .st-steps { display: flex; flex-direction: column; border: 1px solid var(--line-soft); border-radius: var(--r-lg); overflow: hidden; }
  .st-step { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; gap: 8px; align-items: baseline; min-height: 40px; box-sizing: border-box; padding: 9px 10px;
    background: none; border: 0; border-top: 1px solid var(--line-soft); color: var(--hud); font: 14px/1.35 var(--sans); text-align: left; }
  .st-step:first-child { border-top: 0; }
  button.st-step { cursor: pointer; } button.st-step:hover { background: var(--cyan-tint); }
  .st-step .t, .st-step .hull { font-size: 12px; color: var(--dim); }
  .st-step .hull { text-align: right; }
  .st-step .on { color: var(--hostile); }
  .st-step.bad { color: var(--hostile); }
  .st-member .ui-btn { min-height: 40px; }
  .st-test { display: flex; flex-direction: column; gap: 2px; min-height: 44px; box-sizing: border-box; padding: 8px 10px; background: none; border: 0;
    border-top: 1px solid var(--line-soft); color: var(--hud); font: 14px/1.3 var(--sans); text-align: left; }
  .st-test:first-child { border-top: 0; }
  button.st-test { cursor: pointer; } button.st-test:hover { background: var(--cyan-tint); }
  .st-test .name { font-size: 13px; color: var(--dim); }
  .st-test .res { color: var(--bright); }
  .st-test .res.idle { color: var(--dim); }
  .st-title .aside { font-size: 12px; font-weight: 400; color: var(--dim); white-space: nowrap; }
  .st-sec { display: flex; flex-direction: column; gap: 8px; }
  .st-gap { margin-top: 6px; }
  .st-foot-note { text-align: center; font-size: 13px; }
  #st-note { flex: none; margin: 0; padding: 8px 16px 0; font-size: 14px; color: var(--warn); text-align: right; }
  #st-note[hidden] { display: none; }
  .st-nav { flex: none; }
  #st-launch { min-width: 96px; padding: 0 14px; }
  #station .icon { display: block; flex: none; } /* item icons: sized by their width/height attributes */

  /* The hull and its repair, in one row. */
  .st-hull { display: flex; align-items: center; gap: 10px; min-height: var(--hit); }
  .st-hull .gauge { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .st-hull .top { display: flex; justify-content: space-between; align-items: baseline; }
  .st-hull .top .ui-label { font-size: 12px; font-weight: 600; letter-spacing: 0.1em; }
  .st-hull .top .num { font-size: 12px; color: var(--hud); }
  .st-hull .ui-tag { font-size: 13px; padding: 0 6px; }

  /* The switcher: on the Ship tab, stepping between your ship and the squad's; on the Production tab, between a station's orders. */
  .st-switch {
    display: flex; align-items: center; gap: 8px; margin-bottom: -6px; overflow: hidden;
    border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--s1);
  }
  .st-switch-btn {
    flex: none; width: var(--hit); height: var(--hit); display: grid; place-items: center; padding: 0;
    border: 0; background: transparent; color: var(--cyan); font: 400 28px/1 var(--sans); cursor: pointer;
  }
  .st-switch-btn:hover { background: var(--cyan-tint); }
  .st-switch-btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: -2px; }
  .st-switch .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 4px 0; }
  .st-switch .who { font: 600 14px var(--sans); letter-spacing: 0.1em; text-transform: uppercase; color: var(--bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .st-switch .who .num { font: 400 12px var(--mono); letter-spacing: 0; color: var(--dim); }
  .st-switch .dots { display: flex; gap: 2px; }
  .st-switch .dot { width: 12px; height: 10px; display: grid; place-items: center; } /* where you are among the ships; the arrows step */
  .st-switch .dot::after { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); }
  .st-switch .dot[aria-current="true"]::after { background: var(--cyan); }

  /* The ship outline behind the slot buttons, with leader lines from each slot to its place on it. */
  .st-outline, .st-outline svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .st-outline .leaders { stroke: var(--line); stroke-dasharray: 3 3; fill: none; }
  .st-outline .anchors { fill: var(--line-strong); }
  .st-outline .hull { fill: var(--cyan-tint); fill-opacity: 0.5; stroke: var(--cyan); stroke-opacity: 0.55; stroke-width: 1.25; stroke-linejoin: round; }
  .st-outline .spine { stroke: var(--cyan); stroke-opacity: 0.2; }

  /* Trade: the hold's fill, then a row per good: icon (with how many you hold), name, where the
     price sits, Buy and Sell. */
  .st-holdbar { display: flex; align-items: center; gap: 10px; margin-top: -8px; }
  .st-item { position: relative; width: 40px; height: 40px; flex: none; display: grid; place-items: center; }
  .st-item .n { position: absolute; top: -4px; right: -6px; padding: 0 3px; font-size: 11px; color: var(--bright); background: var(--s2); border-radius: 3px; }
  .st-deal { flex: none; display: flex; gap: 6px; }
  .st-deal .ui-btn, .st-deal .lock { min-width: 72px; }
  @media (max-width: 380px) { .st-deal .ui-btn, .st-deal .lock { min-width: 64px; padding: 0 6px; } }
  .st-gauge { position: relative; display: block; height: 3px; margin: 7px 4px 3px; max-width: 160px; background: var(--line); border-radius: 2px; }
  .st-gauge .mark { position: absolute; top: 50%; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--hud); }
  .st-gauge .mark.cheap { background: var(--good); }
  .st-gauge .mark.dear { background: var(--warn); }

  /* Components in store (Research): a row per kind and a column per tier; costs as icon chips. */
  .st-components { width: 100%; border-collapse: collapse; font-size: 14px; }
  .st-components th { font: 700 11px var(--sans); letter-spacing: 0.1em; color: var(--dim); text-align: center; padding: 4px 2px; }
  .st-components tbody th { text-align: left; font: 400 14px var(--sans); letter-spacing: 0; color: var(--hud); border-top: 1px solid var(--line-soft); }
  .st-components td { text-align: center; padding: 6px 2px; color: var(--line-strong); border-top: 1px solid var(--line-soft); font-size: 13px; }
  .st-costs { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 2px; }
  .st-costs .cost { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--hud); }
  .st-costs .cost.short { color: var(--warn); }
  .st-costs .icon { margin: -2px 0; }
  /* A mission's reward on its card: the credits diamond and amount, then item icons (×n). */
  .st-pays { display: inline-flex; align-items: center; gap: 10px; min-width: 0; color: var(--hud); }
  .st-pay { display: inline-flex; align-items: center; gap: 2px; font-size: 12px; }
  .st-pay .icon { margin: -2px 0; }
  .st-also { display: block; margin-top: 2px; font-size: 13px; color: var(--dim); }
  /* A mission's briefing, straight on its sheet: who says it, then every line. */
  .st-brief { display: flex; flex-direction: column; gap: 8px; }
  .st-brief .from { display: flex; align-items: center; gap: 10px; }
  .st-brief .from .ui-label { color: var(--culture, var(--cyan)); }
  .st-brief p { margin: 0; font-size: 15px; line-height: 1.45; color: var(--bright); overflow-wrap: anywhere; }
  .st-brief strong { color: var(--culture, var(--cyan)); font-weight: 600; }
  /* Research: the lab bench (what's building, then the queue as a pipeline of slots), and the
     group's tree of packages (a schematic like the ship's, as tall as the tree). */
  .st-bench { display: flex; align-items: stretch; gap: 12px; }
  .st-bench-cur {
    flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 6px; padding: 10px 12px;
    background: var(--cyan-tint); border: 1px solid var(--cyan); border-radius: var(--r-lg); color: var(--hud);
    font: 400 13px/1.35 var(--mono); text-align: left; cursor: pointer;
  }
  .st-bench-cur.idle { background: var(--s1); border: 1px dashed var(--line-strong); color: var(--dim); cursor: default; }
  .st-bench-cur .cmd { overflow-wrap: anywhere; }
  .st-bench-cur .num { font-size: 12px; color: var(--hud); }
  .st-bench-cur:focus-visible, .st-bench-slot:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .st-bench-q { flex: none; display: flex; gap: 8px; position: relative; }
  .st-bench-q::before { content: ''; position: absolute; left: -12px; right: 8px; top: 50%; border-top: 1px dashed var(--line-strong); z-index: 0; }
  .st-bench-slot {
    position: relative; z-index: 1; width: 52px; padding: 6px 2px; box-sizing: border-box;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 2px;
    background: var(--s1); border: 1px dashed var(--cyan); border-radius: var(--r-md); color: var(--hud); cursor: pointer;
  }
  .st-bench-slot.empty { border-color: var(--line); color: var(--dim); cursor: default; justify-content: center; }
  .st-bench-slot .lbl { max-width: 100%; font: 500 10px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st-bench-slot .num { font-size: 10px; color: var(--dim); }
  .st-tree { margin-top: 4px; }
  .st-tree-lines path { stroke: var(--line-strong); stroke-dasharray: 3 3; }
  .st-tree-lines path.done { stroke: var(--cyan); stroke-opacity: 0.6; stroke-dasharray: none; }
  .st-lane { position: absolute; font: 700 10px var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
  .st-need { display: flex; align-items: center; gap: 8px; min-height: 32px; }
  .st-need .ui-link { font: 500 14px var(--mono); letter-spacing: 0; text-transform: none; padding: 0; }
  .st-need .num { margin-left: auto; font-size: 12px; color: var(--dim); }
  .st-gives { margin: 0; font: 500 14px/1.4 var(--mono); color: var(--hud); }
  .st-pkg-note { font-family: var(--mono); font-size: 13px; font-style: italic; }
  /* Production: the stage's name and order count; per order a status line and a production line on
     a dotted board (input nodes wired by whether storage has them, the stage with the order's meter,
     an arrow to what it makes); storage and the hold as tiles with a detail row; the order sheet's
     products; an input's lineage as a tree; the production pipeline in three columns with its
     links drawn behind (stacked on a phone). */
  .pr-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .pr-title .aside { font: 400 12px var(--mono); color: var(--dim); white-space: nowrap; }
  .pr-order { display: flex; flex-direction: column; gap: 8px; }
  .pr-status { display: flex; align-items: center; gap: 10px; min-height: var(--hit); }
  .pr-stop { display: flex; flex-direction: column; gap: 6px; padding: 8px 0 12px; border-top: 1px solid var(--line); }
  .pr-status .ui-tag { font-size: 13px; }
  .pr-status .txt { flex: 1; min-width: 0; font-size: 15px; color: var(--hud); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pr-board {
    padding: 4px 0 6px; border-radius: 10px;
    background-image: radial-gradient(var(--line-soft) 1px, transparent 1px); background-size: 16px 16px; background-position: 4px 4px;
  }
  .pr-line { display: flex; flex-direction: column; align-items: stretch; width: 100%; max-width: 420px; margin: 0 auto; }
  .pr-ins { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
  .pr-ins.many { gap: 8px 6px; }
  .pr-node {
    position: relative; box-sizing: border-box; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 4px;
    padding: 8px 6px; background: var(--s1); border: 1px solid var(--line); border-radius: var(--r-md); color: var(--hud); font: inherit; text-align: center;
  }
  button.pr-node { cursor: pointer; }
  button.pr-node:hover { border-color: var(--line-strong); }
  button.pr-node:focus-visible, .pr-stage:focus-visible, .pr-empty:focus-visible, .pr-prod:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .pr-node .nm { max-width: 100%; font-size: 14px; font-weight: 600; line-height: 1.1; color: var(--bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pr-node .have { font: 600 11px/1 var(--mono); color: var(--dim); white-space: nowrap; }
  .pr-node.in { justify-self: center; width: min(var(--w), calc(100% - 8px)); height: 84px; }
  .pr-ins.many .pr-node.in { width: 100%; }
  .pr-node.in.miss { border-color: var(--warn); background: rgba(255, 179, 71, 0.06); }
  .pr-node .qn { position: absolute; top: 4px; left: 6px; font: 600 11px var(--mono); color: var(--dim); }
  .pr-wires { position: relative; height: 40px; flex: none; }
  .pr-wires > i { position: absolute; box-sizing: border-box; }
  .pr-wires .q { position: absolute; top: 1px; font: 600 11px var(--mono); }
  .pr-wires.out { height: 34px; }
  .pr-stage {
    align-self: center; width: min(220px, 100%); min-height: 84px; box-sizing: border-box; padding: 10px 12px; display: flex; flex-direction: column; justify-content: space-between; gap: 6px;
    background: var(--s1); border: 1px solid rgba(180, 140, 255, 0.6); border-radius: var(--r-md); color: var(--hud); font: inherit; text-align: left;
  }
  button.pr-stage { cursor: pointer; }
  button.pr-stage:hover { border-color: var(--t4); }
  .pr-stage .top { display: flex; align-items: center; gap: 8px; }
  .pr-stage .top .ui-icon { color: var(--t4); }
  .pr-stage .lbl { flex: 1; font: 700 12px var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--t4); }
  .pr-stage .runs { font-size: 12px; color: var(--hud); }
  .pr-stage .note { font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pr-stage .bar { display: block; height: 4px; background: var(--line-soft); border-radius: 2px; overflow: hidden; }
  .pr-stage .bar > span { display: block; height: 100%; border-radius: inherit; transition: width 0.25s ease-out; }
  @media (prefers-reduced-motion: reduce) { .pr-stage .bar > span { transition: none; } }
  .pr-outs { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
  .pr-node.out { justify-self: center; width: min(130px, calc(100% - 8px)); height: 88px; border-color: var(--edge); margin-top: 7px; }
  .pr-line.done .pr-node.out { background: rgba(182, 255, 138, 0.05); }
  .pr-line.done .pr-node.out .have { color: var(--good); }
  /* The arrowhead into what it makes. */
  .pr-node.out::before { content: ''; position: absolute; top: -8px; left: 50%; margin-left: -5px; border: 5px solid transparent; border-top: 7px solid var(--edge); border-bottom: 0; }
  .pr-empty {
    width: min(220px, 100%); min-height: 120px; margin: 50px auto; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    padding: 10px; background: rgba(11, 14, 23, 0.6); border: 1px dashed var(--line-strong); border-radius: var(--r-md); color: var(--dim); font: 400 13px var(--sans); text-align: center;
  }
  button.pr-empty { cursor: pointer; }
  button.pr-empty:hover { border-color: var(--cyan); }
  .pr-empty .ui-icon { color: var(--t4); opacity: 0.7; }
  .pr-empty .go { font: 700 13px var(--sans); letter-spacing: 0.12em; text-transform: uppercase; color: var(--cyan); }
  .pr-empty.locked .go { color: var(--dim); }
  /* Tiles: as many to a row as fit (five on a phone). */
  .pr-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 6px; }
  .pr-detail { display: flex; align-items: center; gap: 12px; padding: 10px 8px 10px 12px; background: var(--s1); border: 1px solid var(--line); border-radius: var(--r-md); }
  .pr-detail .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .pr-detail .line { display: flex; align-items: baseline; gap: 8px; }
  .pr-detail .nm { font-size: 15px; font-weight: 600; color: var(--bright); }
  .pr-detail .sub { font-size: 13px; line-height: 1.35; color: var(--dim); text-wrap: pretty; }
  /* The order sheet: products to pick, the runs, and its buttons in a row. */
  .pr-prod {
    min-height: 60px; display: flex; align-items: center; gap: 10px; padding: 8px 12px 8px 10px; box-sizing: border-box;
    background: var(--s2); border: 1px solid var(--line-soft); border-radius: var(--r-lg); color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .pr-prod:hover { border-color: var(--line-strong); }
  .pr-prod[aria-pressed="true"] { background: rgba(125, 249, 255, 0.06); border-color: var(--cyan); }
  .pr-prod .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .pr-prod .nm { font-size: 16px; font-weight: 600; color: var(--bright); }
  .pr-prod .formula { font: 400 12px var(--mono); color: var(--dim); }
  .pr-foot { display: flex; gap: 8px; }
  .pr-foot > .ui-btn { min-height: 52px; }
  .pr-foot > .ui-btn.primary { flex: 1; }
  /* An input's lineage: indented a step per level, an elbow from its parent. */
  .pr-lineage { display: flex; flex-direction: column; padding: 4px 0; }
  .pr-lin { display: flex; align-items: stretch; min-height: 52px; padding-left: calc(max(0, var(--depth) - 1) * 33px); }
  .pr-lin .elbow { flex: none; width: 14px; height: 26px; margin-left: 19px; border-left: 1px dashed var(--line-strong); border-bottom: 1px dashed var(--line-strong); }
  .pr-lin .row { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; margin: 3px 0; padding: 6px 10px; border: 1px solid var(--line-soft); border-radius: var(--r-md); }
  .pr-lin:not(.child) .row { background: var(--s2); border-color: var(--line); }
  .pr-lin .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .pr-lin .nm { font-size: 15px; font-weight: 600; color: var(--bright); }
  .pr-lin .have { font: 600 12px var(--mono); white-space: nowrap; }
  .pr-lin-note { margin: 0; font-size: 14px; line-height: 1.4; color: var(--hud); text-wrap: pretty; }
  .src { font-size: 12px; }
  .pr-pipe { display: flex; flex-direction: column; gap: 6px; padding: 10px 0 4px; border-top: 1px solid var(--line-soft); }
  .pr-end { font: 600 14px var(--sans); color: var(--bright); }
  .pr-cols { display: grid; grid-template-columns: repeat(3, 1fr); font: 700 10px var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
  .pr-cols span { padding: 0 4%; }
  .pr-graph { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(var(--rows), var(--row)); }
  .pr-lines { position: absolute; inset: 0; pointer-events: none; }
  .pr-lines svg { display: block; overflow: visible; }
  .pr-lines path { fill: none; stroke: var(--cyan); stroke-opacity: 0.7; stroke-width: 1.5; }
  .pr-lines path.dim { stroke: var(--line-strong); stroke-opacity: 1; }
  .pr-lines path.gap { stroke: var(--warn); stroke-dasharray: 4 3; }
  .pr-lines path.away { stroke-dasharray: 2 4; }
  .pr-cell { position: relative; padding: 4px 4%; min-width: 0; }
  .pr-pnode { display: flex; flex-direction: column; height: 100%; box-sizing: border-box; background: var(--s1); border: 1px solid var(--line); border-left: 3px solid var(--tone, var(--line)); border-radius: var(--r-md); overflow: hidden; }
  .pr-pnode .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding: 6px 8px 0; background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .pr-pnode .main:focus-visible { outline: 2px solid var(--cyan); outline-offset: -2px; }
  .pr-pnode .where { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pr-pnode .what { font-size: 13px; color: var(--bright); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pr-pnode .st { font: 700 10px/1.4 var(--sans); letter-spacing: 0.12em; text-transform: uppercase; color: var(--tone); }
  .pr-pnode .prio { position: absolute; right: calc(4% + 4px); bottom: 8px; display: flex; align-items: center; gap: 8px; }
  .pr-pnode .prio .num { font-size: 11px; color: var(--dim); margin-right: 2px; }
  .pr-pnode .prio .ar { position: relative; width: 30px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: var(--r-sm); background: var(--s2); color: var(--hud); font: 12px var(--mono); cursor: pointer; }
  .pr-pnode .prio .ar::after { content: ''; position: absolute; inset: -7px -4px; } /* a 44 px touch target round the drawn button */
  .pr-pnode .prio .ar:hover { color: var(--cyan); border-color: var(--cyan); }
  .pr-pnode.gap { border-style: dashed; border-color: var(--warn); background: transparent; }
  .pr-pnode.gap .main { cursor: default; }
  .pr-pnode.gap .where { color: var(--warn); }
  .pr-feeds { display: none; flex-direction: column; font-size: 12px; color: var(--cyan); }
  .pr-lone { display: flex; flex-direction: column; gap: 6px; }
  .pr-lone-row { position: relative; display: flex; flex-direction: column; gap: 4px; }
  .pr-lone-row .pr-pnode { min-height: 64px; }
  .pr-lone-row .prio { right: 6px; }
  .pr-gap { font-size: 12px; color: var(--warn); }
  .pr-prio { display: flex; align-items: center; gap: 8px; }
  .pr-prio .num { flex: 1; font-size: 13px; color: var(--hud); }
  @media (max-width: 560px) {
    .pr-cols, .pr-lines { display: none; }
    .pr-graph { display: flex; flex-direction: column; gap: 6px; }
    .pr-cell { padding: 0; }
    .pr-pnode { height: auto; min-height: 64px; }
    .pr-pnode .main { padding-bottom: 6px; }
    .pr-pnode .prio { right: 6px; top: 6px; bottom: auto; }
    .pr-pnode .where { padding-right: 104px; }
    .pr-feeds { display: flex; padding: 0 8px 6px; }
  }
  .st-left { font-size: 12px; color: var(--hud); }

  /* Squad: each member's hull and program; the line editor's fields and conditions. */
  .st-member { display: flex; align-items: center; gap: 10px; }
  .st-member .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .st-member .line { display: flex; gap: 8px; align-items: baseline; }
  .st-member .name { font-size: 17px; font-weight: 600; color: var(--bright); }
  .st-member .sub { font-size: 13px; color: var(--dim); }
  .st-field { display: flex; flex-direction: column; gap: 6px; }
  .st-clause { display: flex; flex-direction: column; gap: 6px; padding-left: 10px; border-left: 2px solid var(--line); }
  .st-clause-head { display: flex; justify-content: space-between; align-items: center; }
  .st-line-tools { display: flex; gap: 6px; flex-wrap: wrap; }
  .st-line-tools .ui-btn { flex: 1 1 0; min-width: 0; padding: 0 8px; }

  /* Settings: a dialog over the flight view (which keeps drawing behind it, so art style changes
     show right away). One group per option: a row of choices and a line about the selected one. */
  #settings, #factions {
    position: fixed; inset: 0; z-index: 3; display: flex; align-items: center; justify-content: center;
    /* clear of the map and settings buttons in the bottom-right corner, which stay above it */
    padding: 16px 16px calc(12px + var(--hit) + 12px + env(safe-area-inset-bottom, 0px)); box-sizing: border-box; background: rgba(2, 3, 6, 0.66);
    font: 15px/1.4 var(--sans); color: var(--hud);
  }
  #settings[hidden], #factions[hidden] { display: none; }
  .set-panel {
    width: min(420px, 100%); max-height: 100%; overflow-y: auto; box-sizing: border-box;
    background: var(--s1); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 8px 16px 16px;
  }
  .set-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 4px; }
  #settings-title, #factions-title { font: 700 22px var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--bright); }
  .set-close {
    width: var(--hit); height: var(--hit); display: grid; place-items: center; margin-right: -10px;
    font: 400 24px/1 var(--sans); color: var(--dim); background: none; border: 0; padding: 0;
    cursor: pointer; touch-action: manipulation;
  }
  .set-close:hover, .set-close:focus-visible { color: var(--cyan); outline: none; }
  .set-group { padding: 12px 0 4px; border-top: 1px solid var(--line-soft); margin-top: 8px; }
  .set-group:first-child { border-top: 0; margin-top: 0; }
  .set-label { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font: 700 11px var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
  .set-label kbd {
    font: 500 10px var(--mono); letter-spacing: 0; color: var(--dim); border: 1px solid var(--line); border-radius: 3px; padding: 1px 5px;
  }
  @media (hover: none) { .set-label kbd { display: none; } } /* keyboard shortcuts mean nothing on touch */
  .seg { display: flex; gap: 6px; }
  .seg .btn { flex: 1 1 0; min-width: 0; min-height: var(--hit); padding: 0 4px; letter-spacing: 0.06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: transparent; }
  .seg .btn[aria-checked="true"] { border-color: var(--cyan); color: var(--bg); background: var(--cyan); }
  .seg .btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .set-hint { margin: 8px 0 0; font-size: 14px; color: var(--hud); }
  /* A folding heading for a group of options (Accessibility, Help). */
  .set-fold {
    display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: var(--hit); margin-top: 8px; padding: 0;
    background: none; border: 0; border-top: 1px solid var(--line-soft); color: var(--dim); cursor: pointer;
    font: 700 11px var(--sans); letter-spacing: 0.14em; text-transform: uppercase;
  }
  .set-fold[aria-expanded="true"] { color: var(--bright); }
  .set-fold:hover, .set-fold:focus-visible { color: var(--cyan); outline: none; }
  .set-fold + .set-group { border-top: 0; margin-top: 0; }
  .set-note { margin: 4px 0 0; color: var(--dim); font-size: 13px; }
  .set-note.locked { color: var(--warn); }

  /* Factions: a row per faction (its colour, name, regard and where it sits from hostile to
     devoted), unfolding to what it stands for and its allies and enemies as chips. */
  .fac-list { display: flex; flex-direction: column; margin-top: 12px; border-top: 1px solid var(--line-soft); }
  .fac-item { border-bottom: 1px solid var(--line-soft); }
  .fac-row {
    display: grid; grid-template-columns: 12px 1fr auto 14px; grid-template-areas: "sw name tier chev" ". bar bar .";
    align-items: center; column-gap: 10px; row-gap: 6px; width: 100%; min-height: var(--hit); padding: 10px 0;
    background: none; border: 0; color: var(--bright); font: 600 15px var(--sans); text-align: left; cursor: pointer; touch-action: manipulation;
  }
  .fac-row:hover .name, .fac-row:focus-visible .name { color: var(--cyan); }
  .fac-row:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .fac-row .swatch { grid-area: sw; width: 12px; height: 12px; border-radius: 3px; background: var(--fc); }
  .fac-row .name { grid-area: name; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fac-row .tier { grid-area: tier; font: 700 11px var(--sans); letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
  .fac-row .tier .num { font: 500 12px var(--mono); letter-spacing: 0; }
  .fac-row .chev { grid-area: chev; color: var(--dim); font-size: 12px; }
  .fac-meter { grid-area: bar; position: relative; height: 4px; background: var(--line); border-radius: 2px; }
  .fac-meter::after { content: ''; position: absolute; left: 50%; top: -3px; width: 1px; height: 10px; background: var(--line-strong); }
  .fac-meter .fill { position: absolute; top: 0; bottom: 0; border-radius: 2px; }
  .fac-more { padding: 0 0 14px 22px; }
  .fac-line { margin: 0 0 10px; font-size: 14px; color: var(--hud); }
  .fac-line .set-label, .fac-rel .set-label { margin-bottom: 4px; }
  .fac-rel { margin-top: 10px; }
  .fac-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .fac-chip {
    min-height: 32px; padding: 0 10px; border: 1px solid var(--fc); border-radius: 16px; background: none;
    color: var(--bright); font: 500 13px var(--sans); cursor: pointer; touch-action: manipulation;
  }
  .fac-chip:hover, .fac-chip:focus-visible { background: var(--s2); outline: none; }
  .fac-none { font-size: 14px; color: var(--dim); }

  /* Comms box: a message from someone in space, with their portrait; tap to go on, or answer.
     A hint (.hint) doesn't wait: taps pass through it to space. */
  #comms {
    --from: #4fd8ff;
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 1;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px)); width: min(560px, calc(100vw - 24px));
    font: 15px/1.4 var(--sans); color: var(--hud); animation: cm-in 0.2s ease-out;
  }
  #comms[hidden] { display: none; }
  @keyframes cm-in { from { opacity: 0; transform: translate(-50%, 8px); } }
  @media (prefers-reduced-motion: reduce) { #comms { animation: none; } }
  .cm-box {
    display: flex; gap: 12px; align-items: flex-start; padding: 12px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--from); border-radius: var(--r-lg);
  }
  #comms.ask .cm-box { cursor: default; }
  #comms.hint { bottom: calc(46px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
  #comms.hint .cm-box { cursor: default; border-left-color: var(--cyan); }
  #comms.hint .cm-from { color: var(--cyan); }
  .cm-face { flex: none; width: 72px; height: 72px; border: 1px solid var(--line); border-radius: var(--r-sm); }
  .cm-face[hidden] { display: none; }
  .cm-main { flex: 1; min-width: 0; }
  .cm-head { display: flex; align-items: center; gap: 8px; }
  .cm-from { flex: 1; min-width: 0; font: 700 11px var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--from); }
  .cm-skip {
    min-height: var(--hit); font: 700 11px var(--sans); letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim);
    background: none; border: 0; padding: 0 8px; margin: -14px -8px -14px 0; cursor: pointer; pointer-events: auto;
  }
  .cm-skip:hover, .cm-skip:focus-visible { color: var(--cyan); outline: none; }
  .cm-skip[hidden] { display: none; }
  .cm-text { margin: 4px 0 0; color: var(--bright); overflow-wrap: anywhere; }
  .cm-text strong { color: var(--from); font-weight: 600; }
  .cm-more { margin-top: 6px; text-align: right; font: 700 11px var(--sans); letter-spacing: 0.12em; text-transform: uppercase; color: var(--dim); }
  .cm-more[hidden], .cm-choices[hidden] { display: none; }
  .cm-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 6px; margin-top: 10px; }
  .cm-choice { min-height: var(--hit); border-color: var(--cyan); color: var(--cyan); background: transparent; padding: 8px 6px; white-space: normal; line-height: 1.2; }
  .cm-choice:hover { background: var(--cyan-tint); }
  .cm-choice.with-face { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 6px; }
  .cm-choice-face { width: 64px; height: 64px; border: 1px solid var(--line); border-radius: var(--r-sm); }
  #resume {
    position: fixed; inset: 0; z-index: 7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    border: 0; background: rgba(2, 3, 6, 0.72); color: var(--bright); cursor: pointer; touch-action: manipulation; font-family: var(--sans);
  }
  #resume[hidden] { display: none; }
  #resume .t { font: 700 calc(26px * var(--ui-scale)) var(--sans); letter-spacing: 0.14em; text-transform: uppercase; }
  #resume .s { font-size: calc(15px * var(--ui-scale)); color: var(--hud); }
  body.intro #factions-btn, body.intro #map-btn, body.intro #settings-btn, body.intro #context { display: none; }
  /* Someone talking on the comms during flight: the box covers the bottom of the screen and the
     corner buttons on a narrow screen; the context menu waits until they're done. */
  body.talking #context, body.talking #factions-btn, body.talking #map-btn, body.talking #settings-btn { display: none; }
  body.warping #context, body.warping #factions-btn, body.warping #map-btn, body.warping #settings-btn { display: none; } /* a gate jump (game/warp.js) */
  /* Landing on a planet and taking off (game/landing.js): no context menu, map or factions. On the
     surface: those buttons back but still no context menu, and Take off at the bottom in the middle. */
  body.landing #context, body.landing #factions-btn, body.landing #map-btn { display: none; }
  #takeoff-btn {
    display: none; position: absolute; z-index: 4; left: 50%; transform: translateX(-50%);
    bottom: calc(12px + env(safe-area-inset-bottom, 0px)); min-height: var(--hit); align-items: center; gap: 8px;
  }
  #takeoff-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
  body.landed #takeoff-btn { display: flex; }
  /* Short of fuel to take off (game/surface-run.js): Jettison, or with not even enough for an empty
     hold, Call a tow; above Take off. */
  #jettison-btn, #tow-btn {
    display: none; position: absolute; z-index: 4; left: 50%; transform: translateX(-50%);
    bottom: calc(12px + var(--hit) + 10px + env(safe-area-inset-bottom, 0px)); min-height: var(--hit); align-items: center; gap: 8px;
  }
  body.landed.short-fuel #jettison-btn, body.landed.stranded #tow-btn { display: flex; }
  /* On a narrow screen the speed bar and the corner buttons leave no room between them: above them. */
  @media (max-width: 600px) {
    #takeoff-btn { bottom: calc(12px + var(--hit) + 14px + env(safe-area-inset-bottom, 0px)); }
    #jettison-btn, #tow-btn { bottom: calc(12px + 2 * var(--hit) + 24px + env(safe-area-inset-bottom, 0px)); }
  }
  body.landed #context { display: none; }

  /* Text size (Settings > Accessibility): the DOM panels are zoomed by --ui-scale (1, 1.15, 1.3; set
     on <html> by game/options.js). A zoomed element's own lengths are zoomed too, so positions and
     sizes measured against the screen are divided by the scale to stay where they were. */
  :root { --ui-scale: 1; }
  #station { zoom: var(--ui-scale); inset: 0 auto auto 0; width: calc(100vw / var(--ui-scale)); height: calc(100dvh / var(--ui-scale)); }
  #station .ui-sheet { left: calc(50vw / var(--ui-scale)); width: min(560px, calc(100vw / var(--ui-scale))); max-height: calc(80dvh / var(--ui-scale)); }
  #station .ui-sheet.tall { height: calc(88dvh / var(--ui-scale)); }
  #station .ui-scrim { inset: 0 auto auto 0; width: calc(100vw / var(--ui-scale)); height: calc(100dvh / var(--ui-scale)); }
  .set-panel { zoom: var(--ui-scale); width: min(420px, calc((100vw - 32px) / var(--ui-scale))); max-height: calc((100dvh - 40px - var(--hit) * var(--ui-scale) - env(safe-area-inset-bottom, 0px)) / var(--ui-scale)); }
  #comms { zoom: var(--ui-scale); left: calc(50vw / var(--ui-scale)); width: min(560px, calc((100vw - 24px) / var(--ui-scale)));
    bottom: calc((14px + env(safe-area-inset-bottom, 0px)) / var(--ui-scale)); }
  #comms.hint { bottom: calc((46px + env(safe-area-inset-bottom, 0px)) / var(--ui-scale)); }
  .panel { zoom: var(--ui-scale); left: calc(50vw / var(--ui-scale)); bottom: calc((60px + env(safe-area-inset-bottom, 0px)) / var(--ui-scale)); }
  #combat { width: min(380px, calc((100vw - 24px) / var(--ui-scale))); }
  .icon-btn { zoom: var(--ui-scale); bottom: calc((12px + env(safe-area-inset-bottom, 0px)) / var(--ui-scale)); }
  #factions-btn { right: calc((12px + 2 * (var(--hit) * var(--ui-scale) + 8px) + env(safe-area-inset-right, 0px)) / var(--ui-scale)); }
  #map-btn { right: calc((12px + var(--hit) * var(--ui-scale) + 8px + env(safe-area-inset-right, 0px)) / var(--ui-scale)); }
  #settings-btn { right: calc((12px + env(safe-area-inset-right, 0px)) / var(--ui-scale)); }
  #context { zoom: var(--ui-scale); }
  #field { zoom: var(--ui-scale); right: calc((12px + env(safe-area-inset-right, 0px)) / var(--ui-scale));
    bottom: calc((12px + var(--hit) * var(--ui-scale) + 12px + env(safe-area-inset-bottom, 0px)) / var(--ui-scale)); }
  #map-overlay .bar { zoom: var(--ui-scale); right: auto; width: calc(100vw / var(--ui-scale)); box-sizing: border-box; }
  #map-overlay .bottom { bottom: 0; }
  #map-prompt { zoom: var(--ui-scale); left: calc(50vw / var(--ui-scale)); bottom: calc((80px + env(safe-area-inset-bottom, 0px)) / var(--ui-scale)); width: min(340px, calc((100vw - 24px) / var(--ui-scale))); }

  /* Wide screens (960 px and up): the station is two columns, the list on the left and the open
     sheet beside it as a detail pane (not over it), so tapping another row swaps the detail. The
     sheet isn't modal there (ui/kit.js), and nothing dims the list. */
  @media (min-width: 960px) {
    #station > .st-head, #station > #st-body, #station > #st-note, #station > .ui-nav { width: min(1080px, 100%); }
    #st-body > :not(.ui-schematic) { width: 100%; max-width: 600px; margin-left: auto; margin-right: auto; box-sizing: border-box; }
    body.sheet-open #st-body > :not(.ui-schematic) { margin-left: 0; }
    body.sheet-open #st-body > .ui-schematic { margin-left: 121px; } /* centred in the 600 px column */
    body.sheet-open #st-body { padding-right: 460px; }
    #station .ui-scrim { display: none; }
    #station .ui-sheet, #station .ui-sheet.tall {
      left: auto; right: calc(max(16px, (100vw - 1080px) / 2 + 16px) / var(--ui-scale)); transform: none;
      top: calc(86px / var(--ui-scale)); bottom: calc((84px + env(safe-area-inset-bottom, 0px)) / var(--ui-scale));
      width: 428px; height: auto; max-height: none; border: 1px solid var(--line); border-radius: var(--r-lg); padding-bottom: 0; animation: none;
    }
    #station .ui-sheet .grab { display: none; }
  }
  .ui-sheet.dragging { transition: none; }

  /* A phone on its side: little height, so the header and the tab bar slim down and the content
     gets the room; the notch's side stays clear. */
  @media (orientation: landscape) and (max-height: 500px) {
    #station { padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); box-sizing: border-box; }
    .st-head { padding: 8px 16px 6px; }
    #st-name { font-size: 16px; }
    #st-sub { display: none; }
    .st-credits { height: 28px; }
    #st-body { padding-top: 10px; gap: 12px; }
    .ui-nav { padding-top: 4px; padding-bottom: calc(4px + env(safe-area-inset-bottom, 0px)); }
    .ui-tab { height: 44px; }
    #st-launch.lg { min-height: 44px; }
    #station .ui-sheet { max-height: calc(94dvh / var(--ui-scale)); }
    #station .ui-sheet.tall { height: calc(94dvh / var(--ui-scale)); }
  }

  /* Larger text on a narrow phone: the tab names drop their capitals and spacing, and Launch
     narrows, so all five names still fit. */
  @media (max-width: 480px) {
    :root:not([data-textsize="100"]) .ui-tab .lbl { text-transform: none; letter-spacing: 0; font-size: 10.5px; }
    :root:not([data-textsize="100"]) #st-launch { min-width: 0; padding: 0 8px; letter-spacing: 0.04em; }
    :root:not([data-textsize="100"]) .ui-nav { gap: 6px; padding-left: 8px; padding-right: 8px; }
  }

  /* Colour-safe palette (Settings > Accessibility): hostile magenta, good pale yellow, so the two are
     told apart without red and green (core/theme.js swaps the canvas colours to match). */
  :root[data-palette="safe"] { --hostile: #ff4fd8; --good: #f4f0a0; --warn: #ff9a3d; }

  /* Reduced motion (Settings, or the system's own setting by default): nothing slides or animates. */
  :root[data-motion="reduce"] *, :root[data-motion="reduce"] *::before, :root[data-motion="reduce"] *::after { animation: none !important; transition: none !important; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="factions-btn" class="btn icon-btn" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Factions" title="Factions (R)">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l7 3v5c0 5-3 8.5-7 10-4-1.5-7-5-7-10V6z"/><path d="M8.5 9.5l3.5 2.5 3.5-2.5M8.5 13.5l3.5 2.5 3.5-2.5"/></svg>
</button>
<button id="map-btn" class="btn icon-btn" type="button" aria-expanded="false" aria-label="Map" title="Map (M)">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5l6-2.5 6 2.5 6-2.5v13.5l-6 2.5-6-2.5-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg>
</button>
<button id="settings-btn" class="btn icon-btn" type="button" aria-haspopup="dialog" aria-label="Settings" title="Settings">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.9 10.2L20.5 10.5L20.5 13.5L17.9 13.8L17.5 14.9L19.0 17.0L17.0 19.0L14.9 17.5L13.8 17.9L13.5 20.5L10.5 20.5L10.2 17.9L9.1 17.5L7.0 19.0L5.0 17.0L6.5 14.9L6.1 13.8L3.5 13.5L3.5 10.5L6.1 10.2L6.5 9.1L5.0 7.0L7.0 5.0L9.1 6.5L10.2 6.1L10.5 3.5L13.5 3.5L13.8 6.1L14.9 6.5L17.0 5.0L19.0 7.0L17.5 9.1z"/><circle cx="12" cy="12" r="2.8"/></svg>
</button>
<button id="takeoff-btn" class="btn" type="button" title="Take off (T)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20.5h18"/><path d="M5.5 20.5a6.5 6.5 0 0 1 13 0"/><path d="M12 11.5v-9M9 5.5l3-3 3 3"/></svg>Take off</button>
<button id="jettison-btn" class="btn" type="button" title="Leave cargo here until the ship can take off">Jettison cargo</button>
<button id="tow-btn" class="btn" type="button" title="Give the ship up: towed home, the hold left here">Call a tow</button>
<div id="context" role="region" aria-label="Selected object" hidden>
  <div class="cx-info" aria-live="polite">
    <div class="cx-head">
      <span class="cx-title"></span>
      <span class="cx-tag" hidden></span>
      <button class="cx-close" type="button" aria-label="Close" title="Close (Esc)">×</button>
    </div>
    <div class="cx-sub"></div>
    <div class="cx-detail" hidden></div>
    <div class="cx-state" hidden></div>
  </div>
  <div class="cx-actions" role="group" aria-label="Actions"></div>
</div>
<div id="combat" class="panel" role="region" aria-label="Combat" aria-live="polite" hidden>
  <div class="cb-head">
    <span class="cb-title"></span>
    <button class="btn cb-btn" type="button"></button>
  </div>
  <div class="cb-track" aria-hidden="true"><span class="cb-timer"></span></div>
  <div class="cb-abil" role="group" aria-label="Kit" hidden></div>
  <div class="cb-rows"></div>
  <div class="cb-log"></div>
</div>

<div id="field" role="toolbar" aria-label="Consumables" hidden></div>
<div id="comms" role="region" aria-label="Comms" aria-live="polite" hidden></div>
<!-- Back from another app mid-fight: paused until tapped (game/loop.js). -->
<button id="resume" type="button" hidden><span class="t">Paused</span><span class="s">Tap to resume the fight</span></button>

<div id="station" class="ui" role="dialog" aria-modal="true" aria-labelledby="st-name" hidden>
  <header class="st-head">
    <span class="culture" aria-hidden="true"></span>
    <div class="id"><span id="st-name"></span><span id="st-sub"></span></div>
    <span class="st-credits" role="img" aria-label="Credits"><i aria-hidden="true"></i><span id="st-credits"></span></span>
  </header>
  <main id="st-body" role="tabpanel"></main>
  <p id="st-note" role="status" hidden></p>
  <nav class="ui-nav st-nav">
    <div class="ui-tabs" role="tablist" aria-label="Station services">
      <button class="ui-tab" type="button" role="tab" data-tab="trade">Trade</button>
      <button class="ui-tab" type="button" role="tab" data-tab="ship">Ship</button>
      <button class="ui-tab" type="button" role="tab" data-tab="research">Research</button>
      <button class="ui-tab" type="button" role="tab" data-tab="industry">Industry</button>
      <button class="ui-tab" type="button" role="tab" data-tab="missions">Missions</button>
    </div>
    <button id="st-launch" class="ui-btn primary lg" type="button">Launch</button>
  </nav>
  <!-- Sheets (a slot's equipment, a mission) slide up over the screen here (ui/kit.js). -->
  <div id="st-layer" class="ui-layer" hidden></div>
</div>

<div id="factions" role="dialog" aria-modal="true" aria-labelledby="factions-title" hidden>
  <div class="set-panel">
    <header class="set-head">
      <span id="factions-title">Factions</span>
      <button class="set-close" type="button" aria-label="Close factions" title="Close (Esc)">×</button>
    </header>
    <div class="fac-body"></div>
  </div>
</div>
<div id="settings" role="dialog" aria-modal="true" aria-labelledby="settings-title" hidden>
  <div class="set-panel">
    <header class="set-head">
      <span id="settings-title">Settings</span>
      <button class="set-close" type="button" aria-label="Close settings" title="Close (Esc)">×</button>
    </header>
    <div class="set-body"></div>
  </div>
</div>

<div id="map-overlay" hidden>
  <canvas id="map-canvas"></canvas>
  <div class="bar top">
    <span id="map-title">SYSTEM</span>
  </div>
  <div class="bar bottom">
    <div id="map-view" class="seg" role="radiogroup" aria-label="Map view">
      <button id="map-view-local" class="btn" type="button" role="radio" aria-checked="true" title="This system (L)">Local</button>
      <button id="map-view-galaxy" class="btn" type="button" role="radio" aria-checked="false" title="Every system charted, and the gates between them (G)">Galaxy</button>
    </div>
    <button id="map-reset" class="btn" type="button">Reset view</button>
    <button id="map-erase" class="btn" type="button" title="Remove your marker" hidden>Erase marker</button>
    <button id="map-contacts" class="btn" type="button" aria-pressed="false" title="Testing: show every deep-space contact" hidden>Contacts</button>
    <span class="spacer"></span>
    <button id="map-fast" class="btn" type="button" aria-pressed="false" title="Fast-forward the trip" hidden>×4</button>
    <button id="map-stop" class="btn" type="button" title="Drop out of cruise here" hidden>Stop</button>
  </div>
  <div id="map-prompt" hidden>
    <span id="map-prompt-text"></span>
    <div class="actions">
      <button id="map-ignore" class="btn" type="button">Ignore</button>
      <button id="map-investigate" class="btn" type="button">Investigate</button>
    </div>
  </div>
</div>

<!-- The game is ES modules: src/main.js imports the rest (layer by layer: core, world, rules, art,
     flight, combat, story, ui). Modules need the page served over http, not opened as a file. -->
<script type="module" src="src/main.js"></script>
</body>
</html>
