name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
  # Each test file on its own, side by side: the rules of each game (game, race, idle, 4x), then the
  # games played through in a stand-in browser (smoke-default, smoke, sim). None needs a dependency.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [game, race, idle, 4x, smoke-default, smoke, sim]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/${{ matrix.suite }}.js
