<!doctype html>
<html lang="en" data-ui="line">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05060a">
  <title>Untitled Space Game 4X</title>
  <!-- The 4X game (notes/4x.md): the main game's galaxy at the main game's scale, zoomed from the
       flight view out to the star system and the galaxy; the player picks units and gives them orders. -->
  <link rel="icon" href="../assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../src/ui/kit.css">
  <link rel="stylesheet" href="../src/ui/kit-line.css">
  <link rel="stylesheet" href="../src/4x/4x.css">
</head>
<body>
  <canvas id="map" aria-label="The map"></canvas>
  <header id="bar" class="ui x-head">
    <div class="id">
      <span id="place"></span>
      <span id="hint" class="x-hint" role="status" aria-live="polite"></span>
    </div>
    <button type="button" id="mode" class="x-mode" aria-pressed="false" title="Build stations round planets and moons (B)">Build</button>
    <button type="button" id="scheme" class="x-scheme" title="How move orders are given (a prototype each)">Move</button>
    <div id="zoom" class="x-zoom" role="group" aria-label="Zoom">
      <button type="button" data-band="flight">Flight</button>
      <button type="button" data-band="system">System</button>
      <button type="button" data-band="galaxy">Galaxy</button>
    </div>
  </header>
  <div class="x-dock">
    <!-- Build mode: the kinds of station to build (4x/building.js), over the card. -->
    <div id="tray" class="ui x-tray" role="toolbar" aria-label="Stations to build" hidden></div>
    <!-- The picked thing: what it is, where, and the orders it takes. -->
    <section id="card" class="ui x-card" hidden>
      <p id="card-kind" class="ui-label"></p>
      <h2 id="card-name" class="ui-title"></h2>
      <p id="card-status" class="ui-note"></p>
      <div id="card-acts" class="x-acts"></div>
    </section>
  </div>
  <script type="module" src="../src/4x/main.js"></script>
</body>
</html>
