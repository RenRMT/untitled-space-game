<!doctype html>
<html lang="en" data-ui="line">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05060a">
  <title>Cold Start</title>
  <!-- The idle station builder (notes/idle.md), in the game's Line style and UI kit. It installs as its
       own app (manifest.webmanifest) and plays offline once opened (sw.js, its file list written by
       `npm run idle:sw`). -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="../assets/idle-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/idle-icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cold Start">
  <link rel="stylesheet" href="../src/ui/kit.css">
  <link rel="stylesheet" href="../src/ui/kit-line.css">
  <link rel="stylesheet" href="../src/idle/idle.css">
</head>
<body>
  <canvas id="map" aria-label="The system"></canvas>
  <header id="bar" class="ui idle-head">
    <span class="culture" aria-hidden="true"></span>
    <div class="id">
      <span id="sys-name"></span>
      <button id="hint" class="idle-hint" type="button"></button>
    </div>
    <span class="idle-credits" role="img" aria-label="Credits"><i aria-hidden="true"></i><span id="credits"></span></span>
  </header>
  <nav id="nav" class="ui ui-nav idle-nav">
    <div id="tabs" class="ui-tabs" role="tablist" aria-label="Views"></div>
  </nav>
  <!-- Sheets (a body, a station, the survey, building) slide up over the map here (ui/kit.js). -->
  <div id="sheets" class="ui-layer" hidden></div>
  <div id="load" class="ui" role="status" aria-live="polite" hidden></div>
  <!-- A station just built: its name over the map's build scene. -->
  <div id="scene" class="ui idle-scene" role="status" aria-live="polite" hidden></div>
  <script type="module" src="../src/idle/main.js"></script>
  <script>
    if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  </script>
</body>
</html>
