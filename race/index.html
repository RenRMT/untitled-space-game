<!doctype html>
<html lang="en" data-ui="lowpoly">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Exo Drift</title>
  <link rel="stylesheet" href="../src/ui/kit.css">
  <link rel="stylesheet" href="../src/ui/kit-lowpoly.css">
  <link rel="stylesheet" href="../src/race/menu.css">
  <style>
    html, body { margin: 0; height: 100%; background: #05060a; color: #dfe6f2; font: 500 13px system-ui, sans-serif; overflow: hidden; }
    #view { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
    #note { position: fixed; left: 0; right: 0; top: 30%; text-align: center; font: 600 15px/1.4 var(--sans); letter-spacing: 0.04em; pointer-events: none; text-shadow: 0 1px 3px #000; white-space: pre-line; }
    #note.big { font-size: 64px; }
  </style>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="note"></div>
  <div id="load" class="ui" role="status" aria-live="polite">
    <div class="rm-load">
      <div class="rm-load-head"><span class="ui-label">Survey uplink</span><span id="load-seed" class="num"></span></div>
      <div class="rm-load-where"><span id="load-planet" class="ui-title"></span><span id="load-level" class="ui-tag"></span></div>
      <div class="rm-load-read"><span id="load-step"></span><span id="load-pct" class="num"></span></div>
      <span class="ui-meter"><span id="load-bar"></span></span>
    </div>
  </div>
  <div id="hud" class="ui" hidden>
    <div id="hud-times" class="rm-read"><span id="hud-lap"></span><span id="hud-time" class="num"></span><span id="hud-rest"></span></div>
    <div id="hud-order"></div>
    <div id="hud-foot">
      <button id="menu-btn" type="button" class="ui-btn ghost" aria-label="Race menu"><span>Menu</span></button>
    </div>
  </div>
  <script type="module" src="../src/race/main.js"></script>
</body>
</html>
